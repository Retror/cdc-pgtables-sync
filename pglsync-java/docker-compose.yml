# pglsync Docker 部署（Java 版）
# 同目录放置：application.yml（外部配置）、pglsync.env（密码）、logs/（chown 10001:10001）
#   docker compose -f docker-compose-java.yml run --rm pglsync-java check
#   docker compose -f docker-compose-java.yml up -d pglsync-java
services:
  pglsync-java:
    image: pglsync-java:1.0.0
    container_name: pglsync-java
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 120s
    env_file:
      - ./pglsync.env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./application.yml:/app/config/application.yml:ro
      - ./logs:/app/logs
    command: ["run"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  load-writer:
    image: pglsync-java:1.0.0
    container_name: pglsync-java-load-writer
    profiles: ["test"]
    network_mode: host
    restart: unless-stopped
    env_file:
      - ./pglsync.env
    volumes:
      - ./application.yml:/app/config/application.yml:ro
    command: ["load-writer"]
